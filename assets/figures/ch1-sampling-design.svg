<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="samp-title samp-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="samp-title">Chapter 1 field sampling design</title>
  <desc id="samp-desc">Smallmouth Bass sampling produces diet observations; in parallel, crayfish availability is measured by baited trapping and active hand sampling, alongside environmental context (temperature and habitat); diet and local prey availability are then combined for prey selection and electivity analysis.</desc>

  <style>
    .surf{fill:#f2f6f6; stroke:#d6e0e0;}
    .accentbox{fill:#0e454e;}
    .label{font-size:14.5px; font-weight:600; fill:#12242c;}
    .wlabel{font-size:14.5px; font-weight:600; fill:#f2f6f6;}
    .small{font-size:12.5px; fill:#35474e;}
    .arrow{stroke:#5d7078; stroke-width:1.6; fill:none; marker-end:url(#arrow2);}
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d7078"/>
    </marker>
  </defs>

  <!-- Smallmouth Bass sampling -->
  <rect x="270" y="16" width="220" height="50" rx="4" class="accentbox"/>
  <text x="380" y="47" text-anchor="middle" class="wlabel">Smallmouth Bass sampling</text>

  <line x1="380" y1="66" x2="380" y2="96" class="arrow"/>

  <!-- Diet observations -->
  <rect x="270" y="98" width="220" height="46" rx="4" class="surf"/>
  <text x="380" y="127" text-anchor="middle" class="label">Diet observations</text>

  <!-- split down to two parallel branches -->
  <line x1="380" y1="144" x2="380" y2="170" class="arrow" marker-end="none"/>
  <line x1="160" y1="170" x2="600" y2="170" stroke="#d6e0e0"/>
  <line x1="160" y1="170" x2="160" y2="196" class="arrow"/>
  <line x1="600" y1="170" x2="600" y2="196" class="arrow"/>

  <!-- Crayfish availability -->
  <rect x="50" y="198" width="220" height="50" rx="4" class="surf"/>
  <text x="160" y="228" text-anchor="middle" class="label">Crayfish availability</text>

  <line x1="120" y1="248" x2="120" y2="270" class="arrow"/>
  <line x1="200" y1="248" x2="200" y2="270" class="arrow"/>
  <rect x="30" y="272" width="180" height="40" rx="4" class="surf"/>
  <text x="120" y="297" text-anchor="middle" class="small">Baited trapping</text>

  <!-- Environmental context -->
  <rect x="490" y="198" width="220" height="50" rx="4" class="surf"/>
  <text x="600" y="228" text-anchor="middle" class="label">Environmental context</text>

  <line x1="540" y1="248" x2="540" y2="270" class="arrow"/>
  <line x1="660" y1="248" x2="660" y2="270" class="arrow"/>
  <rect x="470" y="272" width="140" height="40" rx="4" class="surf"/>
  <text x="540" y="297" text-anchor="middle" class="small">Temperature</text>
  <rect x="620" y="272" width="140" height="40" rx="4" class="surf"/>
  <text x="690" y="297" text-anchor="middle" class="small">Habitat</text>

  <!-- second trapping box for crayfish (active/hand sampling) -->
  <rect x="210" y="272" width="180" height="40" rx="4" class="surf"/>
  <text x="300" y="297" text-anchor="middle" class="small">Active / hand sampling</text>

  <!-- reconverge -->
  <path d="M120,312 L120,340 L380,364" class="arrow"/>
  <path d="M300,312 L300,340 L380,364" class="arrow"/>
  <path d="M540,312 L540,340 L380,364" class="arrow"/>
  <path d="M690,312 L690,340 L380,364" class="arrow"/>
  <path d="M380,144 L380,364" class="arrow" opacity="0"/>

  <rect x="230" y="366" width="300" height="52" rx="4" class="accentbox"/>
  <text x="380" y="398" text-anchor="middle" class="wlabel">Diet + local prey availability</text>

  <line x1="380" y1="418" x2="380" y2="446" class="arrow"/>

  <rect x="190" y="448" width="380" height="60" rx="4" fill="#0e454e"/>
  <text x="380" y="474" text-anchor="middle" class="wlabel">Prey selection /</text>
  <text x="380" y="494" text-anchor="middle" class="wlabel">electivity analysis (Jacobs' D)</text>

  <text x="380" y="540" text-anchor="middle" class="small" fill="#5d7078">Chapter 1 — field sampling design</text>
</svg>
