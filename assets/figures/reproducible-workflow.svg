<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="wf-title wf-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="wf-title">Reproducible research workflow</title>
  <desc id="wf-desc">Field and laboratory experiments produce data, which is analyzed and visualized in R, version-controlled with Git and GitHub, rendered with Quarto, and results in a manuscript, publication, or archived dataset.</desc>

  <style>
    .surf{fill:#f2f6f6; stroke:#d6e0e0;}
    .accentbox{fill:#0e454e;}
    .label{font-size:14px; font-weight:600; fill:#12242c;}
    .wlabel{font-size:14px; font-weight:600; fill:#f2f6f6;}
    .arrow{stroke:#5d7078; stroke-width:1.6; fill:none; marker-end:url(#a5);}
  </style>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d7078"/>
    </marker>
  </defs>

  <rect x="40" y="10" width="280" height="50" rx="4" class="surf"/>
  <text x="180" y="40" text-anchor="middle" class="label">Field / laboratory experiment</text>
  <line x1="180" y1="60" x2="180" y2="86" class="arrow"/>

  <rect x="90" y="88" width="180" height="46" rx="4" class="surf"/>
  <text x="180" y="116" text-anchor="middle" class="label">Data</text>
  <line x1="180" y1="134" x2="180" y2="160" class="arrow"/>

  <rect x="90" y="162" width="180" height="46" rx="4" class="accentbox"/>
  <text x="180" y="190" text-anchor="middle" class="wlabel">R</text>
  <line x1="180" y1="208" x2="180" y2="234" class="arrow"/>

  <rect x="60" y="236" width="240" height="50" rx="4" class="surf"/>
  <text x="180" y="266" text-anchor="middle" class="label">Analysis + visualization</text>
  <line x1="180" y1="286" x2="180" y2="312" class="arrow"/>

  <rect x="60" y="314" width="240" height="50" rx="4" class="accentbox"/>
  <text x="180" y="344" text-anchor="middle" class="wlabel">Git / GitHub</text>
  <line x1="180" y1="364" x2="180" y2="390" class="arrow"/>

  <rect x="90" y="392" width="180" height="46" rx="4" class="surf"/>
  <text x="180" y="420" text-anchor="middle" class="label">Quarto</text>
  <line x1="180" y1="438" x2="180" y2="464" class="arrow"/>

  <rect x="40" y="466" width="280" height="70" rx="4" fill="#0e454e"/>
  <text x="180" y="494" text-anchor="middle" class="wlabel">Manuscript / publication /</text>
  <text x="180" y="514" text-anchor="middle" class="wlabel">archived data</text>

  <text x="180" y="580" text-anchor="middle" font-size="11" fill="#5d7078">Unpublished raw datasets are not made public</text>
  <text x="180" y="596" font-size="11" fill="#5d7078" text-anchor="middle">ahead of the associated manuscript.</text>
</svg>
