<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="ch2-title ch2-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="ch2-title">Chapter 2 predator–prey trial design</title>
  <desc id="ch2-desc">A Smallmouth Bass is pre-conditioned overnight in its assigned opaque tank, then one Signal Crayfish and one Ringed Crayfish are introduced together; the trial is video-recorded for a standardized observation period and scored for which prey (if any) is consumed first, plus secondary behavioral metrics, across six independent tanks run in parallel.</desc>

  <style>
    .surf{fill:#f2f6f6; stroke:#d6e0e0;}
    .accentbox{fill:#0e454e;}
    .label{font-size:14.5px; font-weight:600; fill:#12242c;}
    .wlabel{font-size:14.5px; font-weight:600; fill:#f2f6f6;}
    .small{font-size:12.5px; fill:#35474e;}
    .tiny{font-size:11px; fill:#5d7078;}
    .arrow{stroke:#5d7078; stroke-width:1.6; fill:none; marker-end:url(#a3);}
    .tank{fill:#1c5560; stroke:#0e454e; stroke-width:1.5;}
  </style>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d7078"/>
    </marker>
  </defs>

  <rect x="270" y="14" width="220" height="46" rx="4" class="accentbox"/>
  <text x="380" y="43" text-anchor="middle" class="wlabel">Smallmouth Bass</text>

  <line x1="380" y1="60" x2="380" y2="86" class="arrow"/>

  <rect x="230" y="88" width="300" height="52" rx="4" class="surf"/>
  <text x="380" y="112" text-anchor="middle" class="label">Overnight pre-conditioning</text>
  <text x="380" y="130" text-anchor="middle" class="tiny">~12 h, in the same opaque tank used for the trial</text>

  <line x1="380" y1="140" x2="380" y2="166" class="arrow"/>

  <rect x="200" y="168" width="360" height="52" rx="4" class="surf"/>
  <text x="380" y="192" text-anchor="middle" class="label">1 Signal + 1 Ringed Crayfish introduced</text>
  <text x="380" y="210" text-anchor="middle" class="tiny">size-matched by carapace length</text>

  <line x1="380" y1="220" x2="380" y2="246" class="arrow"/>

  <rect x="230" y="248" width="300" height="52" rx="4" class="surf"/>
  <text x="380" y="272" text-anchor="middle" class="label">Video-recorded observation</text>
  <text x="380" y="290" text-anchor="middle" class="tiny">60 min · low standardized lighting · minimal disturbance</text>

  <line x1="380" y1="300" x2="380" y2="326" class="arrow"/>

  <rect x="150" y="328" width="460" height="72" rx="4" fill="#0e454e"/>
  <text x="380" y="352" text-anchor="middle" class="wlabel">Primary outcome: first prey consumed</text>
  <text x="380" y="372" text-anchor="middle" class="tiny" fill="#cfe3e5">Secondary: approach, attack, aborted attack, capture,</text>
  <text x="380" y="388" text-anchor="middle" class="tiny" fill="#cfe3e5">latency, escape, defensive posture, handling time</text>

  <line x1="380" y1="400" x2="380" y2="424" class="arrow"/>

  <rect x="150" y="426" width="460" height="46" rx="4" class="surf"/>
  <text x="380" y="454" text-anchor="middle" class="label">Repeated standardized observations</text>

  <!-- six tanks row -->
  <text x="380" y="500" text-anchor="middle" class="small">Six independent opaque tanks, one bass per tank, run in parallel</text>

  <g transform="translate(70,516)">
    <g>
      <rect x="0"   y="0" width="90" height="60" rx="3" class="tank"/>
      <rect x="105" y="0" width="90" height="60" rx="3" class="tank"/>
      <rect x="210" y="0" width="90" height="60" rx="3" class="tank"/>
      <rect x="315" y="0" width="90" height="60" rx="3" class="tank"/>
      <rect x="420" y="0" width="90" height="60" rx="3" class="tank"/>
      <rect x="525" y="0" width="90" height="60" rx="3" class="tank"/>
      <text x="45"  y="36" text-anchor="middle" class="tiny" fill="#f2f6f6">T01</text>
      <text x="150" y="36" text-anchor="middle" class="tiny" fill="#f2f6f6">T02</text>
      <text x="255" y="36" text-anchor="middle" class="tiny" fill="#f2f6f6">T03</text>
      <text x="360" y="36" text-anchor="middle" class="tiny" fill="#f2f6f6">T04</text>
      <text x="465" y="36" text-anchor="middle" class="tiny" fill="#f2f6f6">T05</text>
      <text x="570" y="36" text-anchor="middle" class="tiny" fill="#f2f6f6">T06</text>
    </g>
  </g>

  <text x="380" y="610" text-anchor="middle" class="tiny">Chapter 2 — current active protocol (P2.1). Reflects the protocol design; does not represent completed results.</text>
</svg>
